<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" />

  <!-- Concentric Radar Waves -->
  <circle cx="256" cy="270" r="170" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="8 6" />
  <circle cx="256" cy="270" r="120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />
  <circle cx="256" cy="270" r="75" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35" />

  <!-- Cloud Shape with Glow -->
  <g filter="url(#glow)">
    <!-- Main Cloud Body -->
    <path d="M 170,250 
             A 55,55 0 0,1 230,170 
             A 75,75 0 0,1 350,195 
             A 55,55 0 0,1 360,250 
             A 25,25 0 0,1 350,290 
             L 170,290 
             A 25,25 0 0,1 170,250 Z" 
          fill="url(#cloudGrad)" />
  </g>

  <!-- Rain Drops / Laser Streams -->
  <g stroke="#38bdf8" stroke-width="9" stroke-linecap="round">
    <line x1="185" y1="320" x2="170" y2="365" stroke-opacity="0.8" />
    <line x1="235" y1="325" x2="220" y2="385" stroke-opacity="0.95" />
    <line x1="285" y1="320" x2="270" y2="370" stroke-opacity="0.85" />
    <line x1="335" y1="325" x2="320" y2="360" stroke-opacity="0.75" />
  </g>
</svg>
