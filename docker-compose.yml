services:
  # Servidor Backend FastAPI (Uvicorn)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rainloc-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - AEMET_API_KEY=${AEMET_API_KEY:-}
    # El puerto 8000 NO se publica en el host. Solo es accesible internamente por Nginx.
    expose:
      - "8000"
    volumes:
      - backend_data:/app/backend/data

  # Servidor Web y Reverse Proxy (Nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rainloc-web
    restart: unless-stopped
    # Único puerto expuesto hacia el exterior: Puerto 80 HTTP
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
    driver: local
