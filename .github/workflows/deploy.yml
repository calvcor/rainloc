name: Deploy to Home Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita despliegues concurrentes si se suben varios commits seguidos
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Principio de mínimo privilegio para repositorios públicos
permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy (Docker Compose)
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Environment Variables
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          # 1. Si existe .rainloc.env en el usuario del servidor, usarlo como base
          if [ -f "$HOME/.rainloc.env" ]; then
            cp "$HOME/.rainloc.env" .env
            chmod 600 .env
            echo "📄 Archivo .env cargado desde $HOME/.rainloc.env del servidor."
          fi

          # 2. Si se ha configurado el secreto en GitHub Secrets, sobrescribir o añadir la variable
          if [ -n "$AEMET_API_KEY" ]; then
            if [ -f .env ]; then
              sed -i.bak '/^AEMET_API_KEY=/d' .env && rm -f .env.bak
              echo "AEMET_API_KEY=${AEMET_API_KEY}" >> .env
            else
              echo "AEMET_API_KEY=${AEMET_API_KEY}" > .env
            fi
            chmod 600 .env
            echo "🔑 AEMET_API_KEY inyectada con éxito desde GitHub Secrets."
          fi

          if [ ! -f .env ]; then
            echo "⚠️ AVISO: No se detectó archivo .env ni secretos configurados."
          fi

      - name: Deploy Services
        run: |
          echo "🚀 Desplegando RainLoc con Docker Compose..."
          docker compose up -d --build --remove-orphans

      - name: Cleanup Old Docker Images
        run: |
          echo "🧹 Limpiando imágenes obsoletas..."
          docker image prune -f

      - name: Purge Cloudflare Cache
        if: success()
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 1. Obtener credenciales desde GitHub Secrets, .env o $HOME/.rainloc.env
          ZONE_ID="$CF_ZONE_ID"
          API_TOKEN="$CF_API_TOKEN"

          if [ -z "$ZONE_ID" ] && [ -f .env ]; then
            ZONE_ID=$(grep -E '^CLOUDFLARE_ZONE_ID=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          fi
          if [ -z "$API_TOKEN" ] && [ -f .env ]; then
            API_TOKEN=$(grep -E '^CLOUDFLARE_API_TOKEN=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          fi
          if [ -z "$ZONE_ID" ] && [ -f "$HOME/.rainloc.env" ]; then
            ZONE_ID=$(grep -E '^CLOUDFLARE_ZONE_ID=' "$HOME/.rainloc.env" | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          fi
          if [ -z "$API_TOKEN" ] && [ -f "$HOME/.rainloc.env" ]; then
            API_TOKEN=$(grep -E '^CLOUDFLARE_API_TOKEN=' "$HOME/.rainloc.env" | cut -d '=' -f2- | tr -d '"' | tr -d "'" | tr -d '\r' | xargs)
          fi

          # 2. Si están configuradas, ejecutar la purga de caché
          if [ -n "$ZONE_ID" ] && [ -n "$API_TOKEN" ]; then
            echo "⚡ Purgando caché de Cloudflare (Zone ID: ${ZONE_ID:0:6}...)..."
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}')

            if echo "$RESPONSE" | grep -q '"success":true'; then
              echo "✅ Caché de Cloudflare purgada con éxito (purge_everything: true)."
            else
              echo "⚠️ Respuesta de Cloudflare: $RESPONSE"
            fi
          else
            echo "ℹ️ CLOUDFLARE_ZONE_ID o CLOUDFLARE_API_TOKEN no encontrados. Saltando purga."
          fi

          echo "✅ Despliegue completado con éxito."
